# Takyonic — one-click 3-node local cluster.
#
#   docker compose up --build         # build locally and launch the cluster
#   docker compose up -d              # pull ghcr.io image and launch detached
#
# Then connect a Postgres client to node-1 (published on the host):
#   PGPASSWORD=password psql -h 127.0.0.1 -p 5433 -U postgres -d postgres
#
# The nodes discover each other by service name over the `takyonet` bridge and
# elect a Raft leader automatically. The smart pgwire frontend on every node
# transparently forwards writes to whichever node is the current leader, so any
# published port is a valid entry point.
#
# Optional MinIO / S3-backed smoke (Faz D4):
#   docker compose --profile minio up -d minio
#   cargo test --features s3 --lib minio_
#   ./scripts/smoke-s3-compose.sh          # MinIO + local server OR compose node-s3
#   docker compose --profile s3 up --build node-s3 minio
#
# S3-backed single node (pgwire :5436) uses TAKYONIC_S3_* → MinIO on `takyonet`.

x-takyonic-common: &takyonic-common
  # Build locally, but tag as the GHCR image so `docker compose pull` also works.
  image: ghcr.io/hocestnonsatis/takyonic:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - takyonet

services:
  node-1:
    <<: *takyonic-common
    container_name: takyonic-node-1
    hostname: node-1
    command:
      - "--node-id"
      - "1"
      - "--peers"
      - "2:node-2:5001,3:node-3:5001"
    ports:
      - "5433:5433"   # PostgreSQL wire (host entry point)
    volumes:
      - node1-data:/data

  node-2:
    <<: *takyonic-common
    container_name: takyonic-node-2
    hostname: node-2
    command:
      - "--node-id"
      - "2"
      - "--peers"
      - "1:node-1:5001,3:node-3:5001"
    ports:
      - "5434:5433"   # optional: node-2 pgwire on host :5434
    volumes:
      - node2-data:/data

  node-3:
    <<: *takyonic-common
    container_name: takyonic-node-3
    hostname: node-3
    command:
      - "--node-id"
      - "3"
      - "--peers"
      - "1:node-1:5001,2:node-2:5001"
    ports:
      - "5435:5433"   # optional: node-3 pgwire on host :5435
    volumes:
      - node3-data:/data

  # Single-node S3-backed smoke (Faz D4): MinIO as Tier-2 object store.
  node-s3:
    <<: *takyonic-common
    profiles: ["s3"]
    container_name: takyonic-node-s3
    hostname: node-s3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TAKYONIC_S3_ENDPOINT: http://minio:9000
      TAKYONIC_S3_BUCKET: takyonic
      TAKYONIC_S3_ACCESS_KEY: minioadmin
      TAKYONIC_S3_SECRET_KEY: minioadmin
      TAKYONIC_S3_REGION: us-east-1
    command:
      - "--node-id"
      - "1"
    ports:
      - "5436:5433"
    volumes:
      - node-s3-data:/data

  minio:
    image: minio/minio:latest
    container_name: takyonic-minio
    profiles: ["minio", "s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - takyonet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  takyonet:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
  node-s3-data:
  minio-data:
