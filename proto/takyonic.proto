syntax = "proto3";

package takyonic.raft.v1;

// Raft node-to-node RPCs. Payload bytes map to the `bytes` crate via prost
// for zero-copy handoff at the network boundary.
service RaftService {
  // Leader → follower log replication + heartbeat (empty entries).
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);

  // Candidate → peer vote solicitation during leader election.
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);

  // Leader → lagging follower snapshot install (structural; payload is Bytes).
  rpc InstallSnapshot (InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  // Encoded RaftCommand (see crate::raft::RaftCommand::encode).
  bytes command = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Hint for the leader's next_index back-off on conflict.
  uint64 match_index = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  bool done = 6;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

// ---------------------------------------------------------------------------
// Client-facing KV / transaction API (Smart Client SDK).
// Followers answer Ping / mutations with NotLeader(leader_address).
// ---------------------------------------------------------------------------
service ClientService {
  // Topology probe: any node reports whether it is leader and the known
  // leader address (when available).
  rpc Ping (PingRequest) returns (PingResponse);

  // Linearizable point read (served by the leader).
  rpc Get (KvGetRequest) returns (KvGetResponse);

  // Linearizable put (leader only).
  rpc Put (KvPutRequest) returns (KvPutResponse);

  // Snapshot-isolation transaction RPCs (leader-held sessions).
  rpc BeginTxn (BeginTxnRequest) returns (BeginTxnResponse);
  rpc TxnGet (TxnGetRequest) returns (TxnGetResponse);
  rpc TxnPut (TxnPutRequest) returns (TxnPutResponse);
  rpc TxnPutRecord (TxnPutRecordRequest) returns (TxnPutRecordResponse);
  rpc TxnDeleteRecord (TxnDeleteRecordRequest) returns (TxnDeleteRecordResponse);
  rpc TxnCommit (TxnCommitRequest) returns (TxnCommitResponse);
  rpc TxnAbort (TxnAbortRequest) returns (TxnAbortResponse);

  // Schema + cost-based query (SQL logical plan executed on the leader).
  rpc RegisterTable (RegisterTableRequest) returns (RegisterTableResponse);
  rpc ExecuteQuery (ExecuteQueryRequest) returns (ExecuteQueryResponse);
  // Full Volcano SQL via ephemeral SessionState on the leader (Faz 4D).
  rpc ExecuteSessionSql (ExecuteSessionSqlRequest) returns (ExecuteSessionSqlResponse);
}

message PingRequest {}

message PingResponse {
  uint64 node_id = 1;
  string self_address = 2;
  bool is_leader = 3;
  // Known leader id (0 if unknown).
  uint64 leader_id = 4;
  // Advertised host:port of the leader when known (empty if unknown).
  string leader_address = 5;
}

message KvGetRequest {
  bytes key = 1;
}

message KvGetResponse {
  bool found = 1;
  bytes value = 2;
}

message KvPutRequest {
  bytes key = 1;
  bytes value = 2;
}

message KvPutResponse {
  uint64 commit_ts = 1;
}

message BeginTxnRequest {}

message BeginTxnResponse {
  uint64 txn_id = 1;
  uint64 read_ts = 2;
}

message TxnGetRequest {
  uint64 txn_id = 1;
  bytes key = 2;
}

message TxnGetResponse {
  bool found = 1;
  bytes value = 2;
}

message TxnPutRequest {
  uint64 txn_id = 1;
  bytes key = 2;
  bytes value = 3;
}

message TxnPutResponse {}

message TxnCommitRequest {
  uint64 txn_id = 1;
}

message TxnCommitResponse {
  uint64 commit_ts = 1;
}

message TxnAbortRequest {
  uint64 txn_id = 1;
}

message TxnAbortResponse {}

message TxnPutRecordRequest {
  uint64 txn_id = 1;
  string table = 2;
  // Encoded Record (see schema::Record::encode).
  bytes record = 3;
}

message TxnPutRecordResponse {}

message TxnDeleteRecordRequest {
  uint64 txn_id = 1;
  string table = 2;
  string pk = 3;
}

message TxnDeleteRecordResponse {}

message IndexDefMsg {
  string name = 1;
  string column = 2;
}

message RegisterTableRequest {
  string name = 1;
  string primary_key = 2;
  repeated IndexDefMsg indexes = 3;
}

message RegisterTableResponse {}

message FilterPred {
  string column = 1;
  // "=", "!=", ">", ">=", "<", "<="
  string op = 2;
  string value = 3;
}

message ExecuteQueryRequest {
  string table = 1;
  repeated FilterPred filters = 2;
}

message ExecuteQueryResponse {
  // Encoded Record values.
  repeated bytes records = 1;
  // CBO EXPLAIN text.
  string explain = 2;
}

message ExecuteSessionSqlRequest {
  string sql = 1;
}

message ExecuteSessionSqlResponse {
  // PostgreSQL-style command tag (`SELECT`, `INSERT`, `CREATE TABLE`, …).
  string tag = 1;
  // Encoded [`Record`] payloads (same encoding as ExecuteQuery).
  repeated bytes records = 2;
  // Column order for result projection (empty for non-row commands).
  repeated string column_order = 3;
  // Optional row-count / affected for DML (`INSERT 0 N`, etc.).
  optional int64 affected = 4;
}

// ---------------------------------------------------------------------------
// MPP shuffle / fragment execution (coordinator ↔ workers).
// ---------------------------------------------------------------------------
service ShuffleService {
  // Push a batch of rows into a shuffle partition buffer (with backpressure).
  rpc PushShuffle (PushShuffleRequest) returns (PushShuffleResponse);

  // Fetch (and drain) rows for one shuffle partition on this node.
  rpc FetchShuffle (FetchShuffleRequest) returns (FetchShuffleResponse);

  // Execute a worker fragment and return produced rows (local scan / partial agg).
  rpc ExecuteFragment (ExecuteFragmentRequest) returns (ExecuteFragmentResponse);

  // Tear down shuffle buffers for a finished query.
  rpc CloseShuffle (CloseShuffleRequest) returns (CloseShuffleResponse);
}

message PushShuffleRequest {
  uint64 query_id = 1;
  uint64 shuffle_id = 2;
  uint32 partition = 3;
  // Encoded Record payloads.
  repeated bytes rows = 4;
  bool eos = 5;
}

message PushShuffleResponse {
  // True when the receiver accepted the batch (buffer had capacity).
  bool accepted = 1;
  // Hint: wait this many ms before retrying if !accepted.
  uint32 retry_after_ms = 2;
}

message FetchShuffleRequest {
  uint64 query_id = 1;
  uint64 shuffle_id = 2;
  uint32 partition = 3;
}

message FetchShuffleResponse {
  repeated bytes rows = 1;
  bool eos = 2;
}

message ExecuteFragmentRequest {
  // Opaque fragment encoding (see crate::mpp::FragmentSpec::encode).
  bytes fragment = 1;
}

message ExecuteFragmentResponse {
  repeated bytes rows = 1;
}

message CloseShuffleRequest {
  uint64 query_id = 1;
  uint64 shuffle_id = 2;
}

message CloseShuffleResponse {}

// ---------------------------------------------------------------------------
// Distributed 2PC participant wire (coordinator ↔ shard processes).
// ---------------------------------------------------------------------------
service TwopcService {
  rpc Prepare (TwopcPrepareRequest) returns (TwopcAck);
  rpc Commit (TwopcCommitRequest) returns (TwopcAck);
  rpc Abort (TwopcAbortRequest) returns (TwopcAck);
  rpc OrphanedPrepared (TwopcOrphanedRequest) returns (TwopcOrphanedResponse);
  rpc GetAt (TwopcGetAtRequest) returns (TwopcGetAtResponse);
  // Test / chaos helpers (production clients may omit).
  rpc InjectPrepareFailure (TwopcInjectRequest) returns (TwopcAck);
  rpc InjectCrashAfterPrepare (TwopcInjectRequest) returns (TwopcAck);
  rpc RecoverFromRaftLog (TwopcRecoverRequest) returns (TwopcAck);
}

message TwopcWriteOp {
  bytes key = 1;
  // When has_value is false, this is a delete (tombstone).
  bool has_value = 2;
  bytes value = 3;
}

message TwopcReadCheck {
  bytes key = 1;
  uint64 observed_ts = 2;
}

message TwopcPrepareRequest {
  uint64 txn_id = 1;
  uint64 read_ts = 2;
  repeated TwopcWriteOp writes = 3;
  repeated TwopcReadCheck reads = 4;
}

message TwopcCommitRequest {
  uint64 txn_id = 1;
  uint64 commit_ts = 2;
}

message TwopcAbortRequest {
  uint64 txn_id = 1;
}

message TwopcOrphanedRequest {}

message TwopcOrphanedResponse {
  repeated uint64 txn_ids = 1;
}

message TwopcGetAtRequest {
  bytes key = 1;
  uint64 read_ts = 2;
}

message TwopcGetAtResponse {
  bool found = 1;
  bytes value = 2;
}

message TwopcInjectRequest {
  bool enabled = 1;
}

message TwopcRecoverRequest {}

message TwopcAck {
  bool ok = 1;
  string error = 2;
}