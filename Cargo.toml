[package]
name = "takyonic"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "Distributed MVCC NewSQL database with custom Raft and PostgreSQL wire compatibility"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hocestnonsatis/takyonic"

[features]
default = []
# Opt-in helper that installs a default tracing-subscriber from RUST_LOG.
tracing-init = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
crossbeam-channel = "0.5"
dashmap = "6"
futures = "0.3"
memmap2 = "0.9"
parking_lot = "0.12"
pgwire = { version = "0.40", default-features = false, features = ["server-api"] }
prost = "0.13"
sqlparser = { version = "0.62", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[[bin]]
name = "takyonic-server"
path = "src/bin/takyonic-server.rs"